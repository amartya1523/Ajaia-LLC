services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/demo-users
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: ./data/ajaia.db
